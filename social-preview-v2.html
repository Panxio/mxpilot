<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, height=630">
<title>MX Pilot — Social Preview v2 (hero con SVG real del proyecto)</title>
<style>
  /* Paleta (3 familias): fondo #060911 · acento esmeralda #10b981 · tipografía slate (#fff/#cbd5e1/#94a3b8).
     El ratón es el SVG de crates/mx-gui/ui/src/lib/MouseViewer.svelte, sin simplificar,
     con los acentos azules recoloreados a esmeralda para respetar la paleta. */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #060911; color: #f8fafc;
    font-family: "Inter", "Ubuntu", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .grid { position: absolute; inset: 0;
    background-image: radial-gradient(circle at 1px 1px, rgba(51,65,85,.35) 1px, transparent 0);
    background-size: 32px 32px; }
  .glow { position: absolute; right: 40px; top: 60px; width: 620px; height: 520px;
    background: radial-gradient(closest-side, rgba(16,185,129,.20), rgba(5,150,105,.06) 55%, transparent 75%);
    filter: blur(30px); }
  .frame { position: absolute; inset: 16px; border: 1px solid rgba(30,41,59,.6); border-radius: 24px; }

  .safe { position: absolute; left: 80px; top: 80px; width: 1040px; height: 470px;
    display: flex; justify-content: space-between; }

  .col-left { width: 520px; height: 100%; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo { width: 56px; height: 56px; border-radius: 13px;
    box-shadow: 0 10px 25px -4px rgba(16,185,129,.4), 0 0 0 1px rgba(255,255,255,.15); }
  .eyebrow { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 14px; font-weight: 600;
    letter-spacing: .1em; text-transform: uppercase; color: #10b981; }

  h1 { font-size: 112px; font-weight: 800; letter-spacing: -.045em; line-height: .95; color: #fff; }
  h1 .dot { color: #10b981; }
  .tagline { margin-top: 20px; font-size: 25px; line-height: 1.4; color: #cbd5e1; letter-spacing: -.01em; }
  .tagline b { color: #fff; font-weight: 600; }

  .pills { display: flex; flex-wrap: wrap; gap: 10px; }
  .pill { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 15px; font-weight: 600; color: #e2e8f0;
    padding: 8px 14px; border-radius: 8px; background: rgba(15,23,42,.7); border: 1px solid rgba(51,65,85,.9); }

  .foot { display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid rgba(30,41,59,.9);
    font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 14px; color: #94a3b8; }
  .foot .repo { color: #e2e8f0; font-weight: 600; }
  .foot .sep { color: #475569; }
  .foot .ok { color: #10b981; font-weight: 700; }

  .col-right { width: 500px; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .mouse { width: 500px; height: 465px; overflow: visible; }
  .cid { position: absolute; font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 13px; font-weight: 600;
    padding: 6px 11px; border-radius: 6px; color: #f8fafc; background: rgba(6,9,17,.92); border: 1px solid rgba(16,185,129,.55); }
  .cid i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #10b981;
    box-shadow: 0 0 8px #10b981; margin-right: 8px; }
  .cid-top { right: 0; top: 4px; }
</style>
</head>
<body>
<div class="grid"></div>
<div class="glow"></div>
<div class="frame"></div>

<div class="safe">
  <div class="col-left">
    <div class="brand">
      <svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <rect width="512" height="512" rx="112" ry="112" fill="#059669"/>
        <g fill="#ffffff">
          <path d="M 86 356 L 86 156 L 126 156 L 166 256 L 206 156 L 246 156 L 246 356 L 208 356 L 208 220 L 178 300 L 154 300 L 124 220 L 124 356 Z"/>

        <circle cx="410" cy="140" r="16" fill="#a7f3d0"/>

      <span class="eyebrow">Logitech MX · Linux</span>
    </div>

    <div>

      <p class="tagline">Lightweight native Linux driver &amp; GUI for <b>Logitech MX Vertical</b>. Rootless, no Electron.</p>
    </div>

    <div class="pills">
      <span class="pill">Rust</span>
      <span class="pill">Tauri v2</span>
      <span class="pill">Svelte 5</span>
      <span class="pill">HID++</span>
      <span class="pill">/dev/uinput</span>
    </div>

    <div class="foot">
      <span class="repo">Panxio/mxpilot</span><span class="sep">·</span>
      <span class="ok">2.3 MB</span><span>daemon RAM</span><span class="sep">·</span>
      <span class="ok">4.2 MB</span><span>.deb</span>
    </div>
  </div>

      <!-- 4. Estrías -->

    <span class="cid cid-top"><i></i>CID 0x00FD · DPI button</span>

</div>
</body>
</html>
