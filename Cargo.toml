[workspace]
members = [
    "crates/mx-core",
    "crates/mx-probe",
    "crates/mx-uinput",
    "crates/mx-cli",
    "crates/mx-daemon",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["MX Options Linux Contributors"]
license = "GPL-2.0"

[workspace.dependencies]
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
