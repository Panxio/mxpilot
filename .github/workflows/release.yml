name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Linux Packages (.deb & .rpm)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            build-essential \
            libudev-dev \
            libevdev-dev \
            dpkg-dev \
            rpm \
            cpio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'crates/mx-gui/ui/package-lock.json'

      - name: Install frontend dependencies
        run: npm ci --prefix crates/mx-gui/ui

      - name: Run frontend unit and i18n tests
        run: npm --prefix crates/mx-gui/ui test

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Run Rust unit and integration tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Debian (.deb) and RPM (.rpm) Packages
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            ./scripts/package-deb.sh "${VER}"
            ./scripts/package-rpm.sh "${VER}"
          else
            ./scripts/package-deb.sh
            ./scripts/package-rpm.sh
          fi

      - name: Audit Debian and RPM Packages
        run: ./scripts/audit-packages.sh target/mx-options_*_amd64.deb target/mx-options-*.x86_64.rpm

      - name: Upload Release Packages (.deb & .rpm)
        uses: actions/upload-artifact@v4
        with:
          name: mx-options-packages
          path: |
            target/mx-options_*_amd64.deb
            target/mx-options-*.x86_64.rpm
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build-packages
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release Packages
        uses: actions/download-artifact@v4
        with:
          name: mx-options-packages
          path: release-artifacts/

      - name: Generate SHA256 Checksums
        working-directory: release-artifacts
        run: |
          sha256sum *.deb *.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
