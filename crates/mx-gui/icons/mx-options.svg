<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Verde Esmeralda Rico y Auténtico (claramente verde, sin tonos negros) -->
    <linearGradient id="bgGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Resplandor sutil superior -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 1. Fondo Squircle GNOME/FreeDesktop en Verde Esmeralda Rico -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108"
        fill="url(#bgGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.5" />

  <!-- 2. Brillo cenital sutil en la mitad superior -->
  <rect x="26" y="26" width="460" height="230" rx="106" ry="106"
        fill="url(#topGloss)" />

  <!-- 3. Acento ergonómico sutil a 57° -->
  <path d="M 100,410 C 220,430 360,370 410,230" 
        fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" opacity="0.3" />

  <!-- 4. Monograma MX Nítido, Centrado y Blanco Puro (20px de separación libre entre M y X) -->
  <g fill="#ffffff">
    <!-- Letra M (X: 86 a 246, ancho 160) -->
    <path d="M 86,346 
             L 86,166 
             L 126,166 
             L 166,260 
             L 206,166 
             L 246,166 
             L 246,346 
             L 210,346 
             L 210,224 
             L 178,300 
             L 154,300 
             L 122,224 
             L 122,346 
             Z" />

    <!-- Letra X (X: 266 a 426, ancho 160) -->
    <path d="M 266,166 
             L 304,166 
             L 346,236 
             L 388,166 
             L 426,166 
             L 368,256 
             L 426,346 
             L 388,346 
             L 346,276 
             L 304,346 
             L 266,346 
             L 324,256 
             Z" />
  </g>

  <!-- 5. Indicador de cúspide ergonómica 57° -->
  <circle cx="405" cy="180" r="9" fill="#a7f3d0" />
  <circle cx="405" cy="180" r="15" fill="none" stroke="#34d399" stroke-width="2" opacity="0.7" />
</svg>