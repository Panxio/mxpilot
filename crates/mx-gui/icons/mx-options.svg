<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado suave verde esmeralda técnico profundo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="50%" stop-color="#0a3d25" />
      <stop offset="100%" stop-color="#052617" />
    </linearGradient>

    <!-- Bisel de iluminación superior sutil -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
    </linearGradient>

    <!-- Resplandor esmeralda del acento ergonómico 57° -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Sombra de profundidad de glifo -->
    <filter id="glyphShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#021a0f" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- 1. Fondo Squircle (Curvatura estándar GNOME/FreeDesktop) -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108"
        fill="url(#bgGrad)" stroke="#166534" stroke-width="3" />

  <!-- 2. Bisel interno de relieve suave -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104"
        fill="none" stroke="url(#bevelGrad)" stroke-width="4" />

  <!-- 3. Arco ergonómico sutil a 57° en segundo plano -->
  <path d="M 120,400 C 260,420 380,340 400,210" 
        fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.35" />

  <!-- 4. Monograma Tipográfico 'MX' de Alto Contraste (Blanco Nítido #F8FAFC) -->
  <g filter="url(#glyphShadow)">
    <!-- Letra 'M' estilizada y técnica -->
    <path d="M 108,348 
             L 108,164 
             L 156,164 
             L 214,272 
             L 272,164 
             L 320,164 
             L 320,348 
             L 276,348 
             L 276,228 
             L 228,320 
             L 200,320 
             L 152,228 
             L 152,348 
             Z" 
          fill="#f8fafc" />

    <!-- Letra 'X' con corte moderno entrelazado -->
    <path d="M 336,164 
             L 380,164 
             L 424,244 
             L 468,164 
             L 512,164 
             L 450,256 
             L 516,348 
             L 470,348 
             L 424,268 
             L 378,348 
             L 332,348 
             L 398,256 
             Z" 
          transform="translate(-64, 0)"
          fill="#f8fafc" />
  </g>

  <!-- 5. Indicador de cresta vertical (acento de precisión en 57°) -->
  <circle cx="390" cy="180" r="10" fill="#34d399" />
  <circle cx="390" cy="180" r="16" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
</svg>
