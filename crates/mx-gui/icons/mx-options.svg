<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado Verde Esmeralda Oscuro Técnico -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#044e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Bisel interior sutil -->
    <linearGradient id="bevelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>

    <!-- Sombra de profundidad de glifos -->
    <filter id="glyphShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#01150f" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Fondo Squircle estándar FreeDesktop / GNOME -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108"
        fill="url(#bgGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.6" />

  <!-- Bisel de iluminación interna -->
  <rect x="27" y="27" width="458" height="458" rx="105" ry="105"
        fill="none" stroke="url(#bevelGrad)" stroke-width="3" />

  <!-- Acento ergonómico sutil a 57° -->
  <path d="M 100,410 C 220,430 360,370 410,230" 
        fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" opacity="0.25" />

  <!-- Monograma MX con separación limpia (20px de espacio entre M y X) -->
  <g filter="url(#glyphShadow)" fill="#f8fafc">
    <!-- Letra M (X: 86 a 246, ancho 160) -->
    <path d="M 86,346 
             L 86,166 
             L 126,166 
             L 166,260 
             L 206,166 
             L 246,166 
             L 246,346 
             L 210,346 
             L 210,224 
             L 178,300 
             L 154,300 
             L 122,224 
             L 122,346 
             Z" />

    <!-- Letra X (X: 266 a 426, ancho 160) -->
    <path d="M 266,166 
             L 304,166 
             L 346,236 
             L 388,166 
             L 426,166 
             L 368,256 
             L 426,346 
             L 388,346 
             L 346,276 
             L 304,346 
             L 266,346 
             L 324,256 
             Z" />
  </g>

  <!-- Indicador de cúspide ergonómica 57° -->
  <circle cx="405" cy="180" r="9" fill="#34d399" />
  <circle cx="405" cy="180" r="15" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6" />
</svg>